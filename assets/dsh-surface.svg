<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">MYTPONS DSH public tool surface</title>
  <desc id="desc">A technical map of public MYTPONS projects: DSH project memory, browser control, backup, and blackbox web reverse engineering.</desc>
  <rect width="1200" height="320" fill="#f4f4f2"/>
  <rect x="40" y="32" width="4" height="256" fill="#b45309"/>
  <text x="64" y="56" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">MYTPONS / PUBLIC BUILD</text>
  <text x="64" y="108" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">DSH toolchain</text>
  <text x="64" y="142" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="16">Agent systems built to be installed,</text>
  <text x="64" y="166" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="16">tested, restored, and reused.</text>
  <text x="64" y="218" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">JS / TS / PY / GO / KOTLIN</text>
  <text x="64" y="278" fill="#374151" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">github.com/MYTPONS</text>

  <rect x="430" y="34" width="730" height="252" fill="#ffffff" stroke="#d1d5db"/>
  <text x="454" y="62" fill="#111827" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">DSH SURFACE</text>
  <text x="924" y="62" fill="#b45309" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1">PUBLIC / MIT</text>
  <line x1="454" y1="82" x2="1136" y2="82" stroke="#d1d5db"/>
  <text x="454" y="104" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1">LAYER</text>
  <text x="638" y="104" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1">PUBLIC INTERFACE</text>
  <text x="1036" y="104" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1">RELEASE</text>
  <line x1="454" y1="116" x2="1136" y2="116" stroke="#e5e7eb"/>

  <text x="454" y="144" fill="#111827" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">MEMORY</text>
  <text x="638" y="144" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13">records / logs / docs / features</text>
  <text x="1036" y="144" fill="#b45309" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">v1.0.0</text>
  <line x1="454" y1="158" x2="1136" y2="158" stroke="#e5e7eb"/>

  <text x="454" y="186" fill="#111827" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">BROWSER</text>
  <text x="638" y="186" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13">browser_* / Firefox + Chromium</text>
  <text x="1036" y="186" fill="#b45309" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">v1.0.1</text>
  <line x1="454" y1="200" x2="1136" y2="200" stroke="#e5e7eb"/>

  <text x="454" y="228" fill="#111827" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">SAFETY</text>
  <text x="638" y="228" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13">snapshots / retention / restore</text>
  <text x="1036" y="228" fill="#b45309" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">v1.0.0</text>
  <line x1="454" y1="242" x2="1136" y2="242" stroke="#e5e7eb"/>

  <text x="454" y="270" fill="#111827" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">RESEARCH</text>
  <text x="638" y="270" fill="#4b5563" font-family="Arial, Helvetica, sans-serif" font-size="13">blackbox-web-reverse skill</text>
