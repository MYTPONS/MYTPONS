<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">MYTPONS personal workbench</title>
  <desc id="desc">A personal workbench for long-running agents: observe, remember, act, and recover.</desc>
  <rect width="1200" height="360" fill="#f7f4ed"/>
  <rect x="40" y="34" width="4" height="292" fill="#d97706"/>

  <text x="64" y="58" fill="#756b5e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="2">MYTPONS / PERSONAL WORKBENCH</text>
  <text x="64" y="114" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">tools for</text>
  <text x="64" y="160" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">long-running agents</text>
  <text x="64" y="197" fill="#514a41" font-family="Arial, Helvetica, sans-serif" font-size="16">记忆、真实浏览器、可恢复的自动化。</text>
  <text x="64" y="224" fill="#514a41" font-family="Arial, Helvetica, sans-serif" font-size="16">先让流程跑通，再让 agent 接管。</text>
  <text x="64" y="286" fill="#756b5e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="1">LOCAL-FIRST / DSH / WRITING</text>

  <g transform="translate(760 180)">
    <circle r="132" fill="none" stroke="#d8d0c2" stroke-width="1"/>
    <circle r="4" fill="#d97706"/>
    <path d="M -92 -62 A 110 110 0 0 1 74 -82" fill="none" stroke="#b7aa97" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M 104 38 A 110 110 0 0 1 16 116" fill="none" stroke="#b7aa97" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M -22 118 A 110 110 0 0 1 -106 44" fill="none" stroke="#b7aa97" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M -108 -40 A 110 110 0 0 1 -76 -74" fill="none" stroke="#b7aa97" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="0" y="-8" text-anchor="middle" fill="#171717" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" letter-spacing="2">AGENT</text>
    <text x="0" y="16" text-anchor="middle" fill="#756b5e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10" letter-spacing="1">LOOP</text>

    <g transform="translate(-158 -116)">
      <circle cx="0" cy="0" r="4" fill="#d97706"/>
      <text x="14" y="0" fill="#171717" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">OBSERVE</text>
      <text x="14" y="18" fill="#756b5e" font-family="Arial, Helvetica, sans-serif" font-size="12">real browser</text>
    </g>
    <g transform="translate(76 -136)">
      <circle cx="0" cy="0" r="4" fill="#d97706"/>
      <text x="14" y="0" fill="#171717" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">REMEMBER</text>
      <text x="14" y="18" fill="#756b5e" font-family="Arial, Helvetica, sans-serif" font-size="12">project context</text>
    </g>
    <g transform="translate(104 104)">
      <circle cx="0" cy="0" r="4" fill="#d97706"/>
      <text x="14" y="0" fill="#171717" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">ACT</text>
      <text x="14" y="18" fill="#756b5e" font-family="Arial, Helvetica, sans-serif" font-size="12">files &amp; tools</text>
    </g>
    <g transform="translate(-156 102)">
      <circle cx="0" cy="0" r="4" fill="#d97706"/>
      <text x="14" y="0" fill="#171717" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">RECOVER</text>
      <text x="14" y="18" fill="#756b5e" font-family="Arial, Helvetica, sans-serif" font-size="12">snapshots</text>
    </g>
  </g>

  <text x="64" y="334" fill="#8a8175" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">github.com/MYTPONS</text>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7aa97"/>
    </marker>
  </defs>
</svg>
